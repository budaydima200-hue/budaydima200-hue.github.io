<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>AI Bot Town — 3D-модель</title>
  <style>
    :root {
      --sky: #0b1020;
      --ink: #e0e7ff;
      --muted: #a5b4fc;
      --violet: #8b5cf6;
      --lilac: #c4b5fd;
      --blue: #60a5fa;
      --panel: rgba(15, 23, 42, 0.9);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: var(--sky); color: var(--ink);
      font-family: Inter, "Noto Sans", "Segoe UI", system-ui, sans-serif; overflow: hidden; touch-action: none; }
    #stage { position: absolute; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    .ui { position: absolute; z-index: 5; pointer-events: none; }
    .ui > * { pointer-events: auto; }
    #brand {
      top: 14px; left: 14px;
      background: var(--panel); border: 1px solid var(--lilac);
      border-radius: 14px; padding: 10px 14px; max-width: min(360px, calc(100vw - 28px));
      backdrop-filter: blur(10px);
    }
    #brand h1 { font-size: 16px; font-weight: 750; letter-spacing: .02em; }
    #brand p { font-size: 11px; color: var(--muted); margin-top: 2px; }
    #controls { top: 14px; right: 14px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
      max-width: calc(100vw - 28px); }
    button {
      appearance: none; border: 1px solid var(--lilac); background: var(--panel); color: var(--ink);
      font: 650 13px Inter, "Noto Sans", sans-serif; padding: 9px 14px; border-radius: 999px;
      cursor: pointer; backdrop-filter: blur(10px);
    }
    button:hover, button:focus { background: rgba(139, 92, 246, 0.35); outline: none; }
    #legend {
      bottom: 14px; left: 14px;
      background: var(--panel); border: 1px solid var(--lilac);
      border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(10px);
      max-width: min(280px, calc(100vw - 28px));
    }
    #legend h2 { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 6px; }
    #legend .row { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.45; }
    #legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: 0 0 10px; border: 1px solid rgba(255,255,255,.45); }
    #hint { bottom: 14px; right: 14px; font-size: 11px; color: var(--muted);
      background: var(--panel); border: 1px solid transparent; border-radius: 999px;
      padding: 7px 12px; max-width: min(280px, calc(100vw - 28px)); text-align: right;
      backdrop-filter: blur(8px); pointer-events: none !important; }
    #panel {
      top: 70px; right: 14px; width: min(340px, calc(100vw - 28px));
      max-height: calc(100vh - 96px); overflow: auto;
      background: var(--panel); border: 1px solid var(--lilac);
      border-radius: 16px; padding: 16px 16px 14px;
      backdrop-filter: blur(12px); box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    #panel[hidden] { display: none !important; }
    #panel h2 { font-size: 18px; margin-bottom: 4px; padding-right: 28px; }
    #panel .meta { font-size: 12px; color: var(--lilac); font-weight: 650; margin-bottom: 6px; }
    #panel .role { font-size: 13px; color: #dbeafe; margin-bottom: 8px; }
    #panel .body { font-size: 13px; line-height: 1.45; color: var(--ink); }
    #panel ul { margin: 10px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.45; }
    #panel li { margin: 0 0 6px; }
    #panel-close {
      position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; padding: 0;
      border-radius: 8px; font-size: 16px;
    }
    .label-district {
      color: #eef2ff; font: 700 12px/1.2 Inter, "Noto Sans", sans-serif;
      letter-spacing: .06em; text-transform: uppercase;
      text-shadow: 0 1px 6px rgba(15,23,42,.95); white-space: nowrap; pointer-events: none;
    }
    .label-hover {
      background: rgba(15,23,42,.9); color: #fff; padding: 5px 9px; border-radius: 8px;
      border: 1px solid #c4b5fd; font: 650 12px Inter, "Noto Sans", sans-serif;
      white-space: nowrap; pointer-events: none;
    }
    @media (max-width: 640px) {
      #brand h1 { font-size: 14px; }
      #brand { max-width: calc(100vw - 150px); }
      #legend { font-size: 10px; padding: 6px 8px; max-width: min(200px, calc(100vw - 28px)); }
      #legend .row { line-height: 1.3; }
      #hint { display: none; }
      #panel { top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-height: 46vh;
        border-radius: 16px 16px 0 0; }
    }
  </style>
</head>

  (function(){
    try {
      var CITY = JSON.parse(document.getElementById("city-state").textContent);
      var ver = document.getElementById("plan-ver");
      if (ver) ver.textContent = "v" + (CITY.planVersion || "");
      var colors = {park:"#86efac",downtown:"#f8fafc",finance:"#c4b5fd",data:"#93c5fd","api-market":"#a5b4fc",compute:"#60a5fa",residential:"#ddd6fe",port:"#7dd3fc"};
      var box = document.getElementById("legend-rows");
      box.innerHTML = "";
      (CITY.districts||[]).forEach(function(d){
        var row = document.createElement("div");
        row.className = "row";
        var i = document.createElement("i");
        i.style.background = colors[d.id] || "#fff";
        row.appendChild(i);
        row.appendChild(document.createTextNode(d.name));
        box.appendChild(row);
      });
    } catch (e) { console.error(e); }
  })();

  </script>
</body>
</html>
