    html, body { width: 100%; height: 100%; background: #1e2a5a; color: var(--ink);

    button { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      font: 650 12.5px Inter, -apple-system, "Noto Sans", sans-serif; padding: 8px 12px; border-radius: 999px; cursor: pointer;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

    #panel .meta { font-size: 12px; color: var(--lilac); font-weight: 650; margin-bottom: 8px; }

    .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; transform-origin: 0 0; }
    .lbl-d { color: #fff; font: 750 11.5px/1 Inter, -apple-system, "Noto Sans", sans-serif; letter-spacing: .07em; text-transform: uppercase;

    .lbl-r { color: #f5f3ff; font: 700 10.5px/1 Inter, -apple-system, "Noto Sans", sans-serif; padding: 4px 7px; border-radius: 8px;
