<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e2a5a">
  <title>AI Bot Town — 3D-модель</title>
  <style>
    :root {
      --ink: #eef2ff; --muted: #c7d2fe; --violet: #8b5cf6; --lilac: #c4b5fd; --blue: #93c5fd;
      --panel: rgba(23, 30, 66, 0.82); --line: rgba(196, 181, 253, 0.75);
      --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #1e2a5a; color: var(--ink);
      font-family: Inter, -apple-system, "SF Pro Text", "Noto Sans", "Segoe UI", system-ui, sans-serif;
      overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #stage { position: absolute; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
    .ui { position: absolute; z-index: 5; }
    .glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 28px rgba(15, 23, 42, .28); }
    #brand { top: calc(12px + var(--sat)); left: calc(12px + var(--sal)); border-radius: 14px; padding: 9px 13px;
      max-width: min(360px, calc(100vw - 170px)); pointer-events: none; }
    #brand h1 { font-size: 15px; font-weight: 750; letter-spacing: .02em; }
    #brand p { font-size: 11px; color: var(--muted); margin-top: 2px; }
    #controls { top: calc(12px + var(--sat)); right: calc(12px + var(--sar)); display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 50vw; }
    button { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      font: 650 12.5px Inter, -apple-system, "Noto Sans", sans-serif; padding: 8px 12px; border-radius: 999px; cursor: pointer;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    button:hover, button:focus-visible { background: rgba(139, 92, 246, .45); outline: none; }
    #legend { bottom: calc(12px + var(--sab)); left: calc(12px + var(--sal)); border-radius: 14px; padding: 4px; max-width: min(270px, calc(100vw - 24px)); }
    #legend-toggle { border: 0; background: transparent; width: 100%; text-align: left; padding: 6px 8px;
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); backdrop-filter: none; -webkit-backdrop-filter: none; }
    #legend-toggle .chev { display: inline-block; transition: transform .2s; margin-left: 4px; }
    #legend.collapsed .chev { transform: rotate(-90deg); }
    #legend-body { padding: 0 8px 7px; }
    #legend.collapsed #legend-body { display: none; }
    #legend .row { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.5; cursor: pointer; }
    #legend .row:hover { color: #fff; }
    #legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: 0 0 10px; border: 1px solid rgba(255,255,255,.6); }
    #legend .key { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(196,181,253,.3); font-size: 11.5px; color: var(--muted); line-height: 1.5; }
    #legend .key b { color: #ddd6fe; }
    #hint { bottom: calc(12px + var(--sab)); right: calc(12px + var(--sar)); font-size: 11px; color: var(--muted);
      border-radius: 999px; padding: 7px 12px; max-width: min(300px, calc(100vw - 24px)); text-align: right; pointer-events: none; }
    #panel { top: calc(62px + var(--sat)); right: calc(12px + var(--sar)); width: min(350px, calc(100vw - 24px));
      max-height: calc(100vh - 90px); overflow: auto; border-radius: 18px; padding: 16px 16px 14px; z-index: 6; }
    #panel[hidden] { display: none !important; }
    #panel h2 { font-size: 18px; margin-bottom: 4px; padding-right: 30px; }
    #panel .meta { font-size: 12px; color: var(--lilac); font-weight: 650; margin-bottom: 8px; }
    #panel .role { display: inline-block; font-size: 12px; font-weight: 650; padding: 4px 9px; border-radius: 999px; margin-bottom: 9px;
      background: rgba(147,197,253,.16); border: 1px solid rgba(147,197,253,.55); color: #dbeafe; }
    #panel .role.res { background: rgba(139,92,246,.28); border-color: #a78bfa; color: #ede9fe; }
    #panel .body { font-size: 13px; line-height: 1.5; color: var(--ink); }
    #panel ul { margin: 10px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.45; color: #e0e7ff; }
    #panel li { margin: 0 0 6px; }
    #panel-close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; padding: 0; border-radius: 9px; font-size: 17px; }
    .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; transform-origin: 0 0; }
    .lbl-d { color: #fff; font: 750 11.5px/1 Inter, -apple-system, "Noto Sans", sans-serif; letter-spacing: .07em; text-transform: uppercase;
      padding: 5px 9px; border-radius: 999px; background: rgba(30, 41, 99, .55); border: 1px solid rgba(196,181,253,.55);
      text-shadow: 0 1px 4px rgba(15,23,42,.8); }
    .lbl-r { color: #f5f3ff; font: 700 10.5px/1 Inter, -apple-system, "Noto Sans", sans-serif; padding: 4px 7px; border-radius: 8px;
      background: rgba(109, 40, 217, .78); border: 1px solid #ddd6fe; box-shadow: 0 0 12px rgba(167,139,250,.7); }
    .lbl-r::before { content: "◆ "; color: #e9d5ff; }
    .lbl-h { background: rgba(15,23,42,.88); color: #fff; padding: 5px 9px; border-radius: 8px; border: 1px solid #c4b5fd;
      font: 650 12px Inter, -apple-system, "Noto Sans", sans-serif; }
    @media (max-width: 640px) {
      #brand h1 { font-size: 13.5px; }
      #brand p { font-size: 10.5px; }
      button { font-size: 12px; padding: 7px 10px; }
      #hint { display: none; }
      .lbl-d { font-size: 9.5px; padding: 4px 7px; letter-spacing: .05em; }
      .lbl-r { font-size: 9.5px; padding: 3px 6px; }
      #panel { top: auto; bottom: 0; right: 0; left: 0; width: 100%; max-height: 48vh; border-radius: 18px 18px 0 0;
        padding-bottom: calc(14px + var(--sab)); }
    }

    /* ---------- live layer v2.2 ---------- */
    .lbl-a { color: #fff; font: 750 10.5px/1 Inter, -apple-system, "Noto Sans", sans-serif; padding: 4px 8px 4px 6px; border-radius: 999px;
      background: rgba(30, 27, 75, .82); border: 1.5px solid var(--c, #c4b5fd); box-shadow: 0 0 10px rgba(167,139,250,.55); }
    .lbl-a::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c, #c4b5fd); margin-right: 5px; vertical-align: 0; }
    .lbl-s { color: #1e1b4b; font: 650 11px/1.25 Inter, -apple-system, "Noto Sans", sans-serif; padding: 5px 9px; border-radius: 10px 10px 10px 3px;
      background: rgba(255,255,255,.95); border: 1px solid #c4b5fd; box-shadow: 0 4px 14px rgba(30,27,75,.35); max-width: 260px; white-space: normal; }
    .lbl-t { color: #eff6ff; font: 700 10.5px/1 Inter, -apple-system, "Noto Sans", sans-serif; padding: 4px 8px; border-radius: 8px;
      background: rgba(14, 116, 144, .82); border: 1px solid #a5d8ff; box-shadow: 0 0 12px rgba(125,211,252,.7); }
    .lbl-t::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: #a5d8ff; margin-right: 5px; animation: blinkT 1s infinite; }
    @keyframes blinkT { 50% { opacity: .2; } }
    #live { top: calc(74px + var(--sat)); left: calc(12px + var(--sal)); width: min(380px, calc(100vw - 24px)); max-height: calc(100vh - 150px);
      border-radius: 18px; display: flex; flex-direction: column; z-index: 5; overflow: hidden; }
    #live-head { display: flex; align-items: center; gap: 6px; padding: 8px 8px 4px; }
    #live .tabs { display: flex; gap: 4px; flex: 1; background: rgba(15,23,42,.35); border-radius: 999px; padding: 3px; }
    #live .tabs button { flex: 1; border: 0; background: transparent; padding: 7px 6px; font-size: 12.5px; color: var(--muted); backdrop-filter: none; -webkit-backdrop-filter: none; }
    #live .tabs button.on { background: linear-gradient(135deg, #8b5cf6, #6d8cf0); color: #fff; box-shadow: 0 2px 10px rgba(139,92,246,.5); }
    #live-toggle { width: 34px; height: 34px; padding: 0; flex: 0 0 34px; font-size: 14px; }
    #live-status { font-size: 11px; color: var(--muted); padding: 2px 14px 8px; line-height: 1.4; }
    #live-status b { color: #fff; font-weight: 700; }
    #live-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
    #live-status .dot.on { background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,.7); animation: livePulse 1.8s infinite; }
    #live-status .dot.off { background: #93c5fd; }
    @keyframes livePulse { 70% { box-shadow: 0 0 0 7px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
    #live-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 10px 12px; touch-action: pan-y; overscroll-behavior: contain; }
    #live.collapsed #live-body { display: none; }
    #live.collapsed #live-status { padding-bottom: 9px; }
    .feed { display: flex; flex-direction: column; gap: 6px; }
    .ev, .rrow { display: block; width: 100%; text-align: left; border-radius: 12px; padding: 8px 10px; background: rgba(255,255,255,.07);
      border: 1px solid rgba(196,181,253,.28); backdrop-filter: none; -webkit-backdrop-filter: none; font-weight: 500; }
    .ev.now { border-color: #4ade80; background: rgba(74,222,128,.1); }
    .ev-top { display: flex; align-items: baseline; gap: 6px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
    .ev-time { color: #e0e7ff; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ev-who { color: #fff; font-weight: 700; }
    .ev-who::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c, #c4b5fd); margin-right: 4px; }
    .ev-who.tool::before { border-radius: 2px; background: #a5d8ff; }
    .ev-src { margin-left: auto; font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid rgba(196,181,253,.45); color: #ddd6fe; }
    .ev-act { font-size: 12.5px; color: #fff; margin-top: 3px; line-height: 1.35; }
    .foot, .empty { font-size: 11px; color: var(--muted); line-height: 1.45; margin-top: 10px; }
    .res { display: flex; flex-direction: column; gap: 6px; }
    .rrow { display: flex; gap: 10px; align-items: flex-start; }
    .rdot { flex: 0 0 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); margin-top: 3px; box-shadow: 0 0 8px var(--c); }
    .rtxt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rtxt b { font-size: 13px; color: #fff; }
    .rrole { font-size: 11px; color: var(--muted); }
    .rst { display: flex; flex-direction: column; gap: 2px; margin-top: 3px; }
    .rsub { font-size: 11px; color: #e0e7ff; }
    .rsub.replay { color: #c4b5fd; }
    .pill { display: inline-block; align-self: flex-start; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
      background: rgba(147,197,253,.18); border: 1px solid rgba(147,197,253,.55); color: #dbeafe; }
    .rst.work .pill { background: rgba(74,222,128,.18); border-color: #4ade80; color: #dcfce7; }
    .pill.st-nt { background: rgba(203,213,225,.14); border-color: rgba(203,213,225,.5); color: #e2e8f0; }
    .pill.st-ok { background: rgba(74,222,128,.18); border-color: #4ade80; color: #dcfce7; }
    .pill.st-weak { background: rgba(251,191,36,.18); border-color: #fbbf24; color: #fef3c7; }
    .pill.st-need { background: rgba(244,114,182,.2); border-color: #f472b6; color: #fce7f3; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; touch-action: pan-x; }
    .chip { flex: 0 0 auto; font-size: 12px; padding: 6px 10px; border-color: var(--c); backdrop-filter: none; -webkit-backdrop-filter: none; }
    .chip.on { background: var(--c); color: #1e1b4b; }
    .card { background: rgba(255,255,255,.06); border: 1px solid rgba(196,181,253,.3); border-radius: 14px; padding: 10px 12px; }
    .card-h { display: flex; flex-direction: column; gap: 1px; margin-bottom: 6px; } .card-h b { font-size: 15px; } .card-h span { font-size: 11.5px; color: var(--muted); }
    .counts { display: flex; gap: 5px; flex-wrap: wrap; }
    .card h4 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--lilac); margin: 12px 0 6px; }
    .card ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .card li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; line-height: 1.35; }
    .card li .sk { flex: 1 1 160px; color: #fff; }
    .card li .sub { flex: 1 1 100%; font-size: 11px; color: var(--muted); }
    @media (max-width: 640px) {
      #live { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-height: 50vh; border-radius: 20px 20px 0 0; padding-bottom: var(--sab); border-bottom: 0; }
      #live-head { padding: 8px 10px 4px; }
      #live .tabs button { font-size: 13px; padding: 8px 6px; }
      #legend { bottom: calc(96px + var(--sab)); }
      #panel { z-index: 7; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="labels"></div>
  <div id="brand" class="ui glass">
    <h1>AI Bot Town — 3D</h1>
    <p>Генплан «Острів-гавань» · <span id="plan-ver"></span></p>
  </div>
  <div id="controls" class="ui">
    <button type="button" id="toggle-rot" aria-pressed="true">⏸ Обертання</button>
    <button type="button" id="reset-cam">Скинути камеру</button>
  </div>
  <div id="legend" class="ui glass">
    <button type="button" id="legend-toggle" aria-expanded="true">Райони <span class="chev">▾</span></button>
    <div id="legend-body">
      <div id="legend-rows"></div>
      <div class="key"><b>◆</b> фіолетовий маркер — будинок жителя-бота<br>Решта — громадські будівлі</div>
    </div>
  </div>
  <div id="hint" class="ui glass">Обертайте, зуміть, торкніться будівлі — відкриється картка. Подія в стрічці покаже бота.</div>
  <section id="live" class="ui glass" aria-label="Живе місто">
    <div id="live-head">
      <div class="tabs" role="tablist">
        <button type="button" data-tab="feed" role="tab">Стрічка подій</button>
        <button type="button" data-tab="res" role="tab">Жителі</button>
        <button type="button" data-tab="school" role="tab">Школа</button>
      </div>
      <button type="button" id="live-toggle" aria-label="Згорнути">▾</button>
    </div>
    <div id="live-status"></div>
    <div id="live-body"></div>
  </section>
  <aside id="panel" class="ui glass" hidden>
    <button type="button" id="panel-close" aria-label="Закрити">×</button>
    <h2 id="panel-title"></h2>
    <div class="meta" id="panel-meta"></div>
    <div class="role" id="panel-role"></div>
    <div class="body" id="panel-body"></div>
    <div id="panel-tools"></div>
  </aside>

на в'їзді з магістралі «Інтернет»; smoke EICAR і чистий файл. Мерія статистики збирає лише реальні метрики в Районі Даних. Школа навчає за профілями потреб жителів, з табелем (усі навички «не перевірено»), іспитами та bin/lesson; уроки ботам не надсилались. Індексація в локальний Meilisearch, без моделей ембедингів. Усе з GitHub або локально, без реєстрацій, root і Docker. Генплан v1.5.0. Час: 14 листопада 2026, 19:35 CET (Europe/Bratislava)."}, {"date": "2026-11-15", "title": "Збудовано 3D-модель міста", "detail": "Самодостатній файл city3d.html: ізометрична 3D-діорама всіх 8 районів, магістралі «Інтернет», вулиць-протоколів, 27 будівель і 6 жителів на тих самих місцях, що й на 2D-мапі. three.js 0.187 разом з OrbitControls і CSS2DRenderer вбудовано інлайном, без CDN і мережі — файл відкривається з file:// офлайн у браузері. Ратуша з фіолетовим маяком, світлові імпульси на магістралі, дуги зв'язку до Ратуші, легенда районів, підписи, бічна панель українською та керування (обертання, зум, пан, автообертання, «Скинути камеру», touch). Знімки: city3d.png і city3d-panel.png. Генплан v1.6.0. Час: 15 листопада 2026, 09:55 CET (Europe/Bratislava)."}, {"date": "2026-11-15", "title": "Прийнято генплан v2.0.0 «Острів-гавань»", "detail": "Місто перенесено на природний зелений острів з рельєфом у темно-синьому морі. Південь — гавань з причалами, кораблями даних, Митною аркою, набережною (Поліція, Пожежна частина, Майстерня з верф'ю) і Вокзалом на кінці мосту магістралі «Інтернет». Центр — пагорб Даунтауну з Ратушею, круглою Площею зборів і Секретаріатом. Схід — Фінансова вулиця (вежі XTB і Grok Bot, Банк, Пошта). Північ — долина з річкою, Житловий квартал, Школа й Парк навчання. Захід — Район Даних, на скелі Метеостанція й маяк. Медіа-вежа стоїть на окремому пагорбі. Усі 27 будівель і 6 жителів збережено, нових ботів не додано. 3D-модель і 2D-мапа оновлені під новий план. Час: 15 листопада 2026, 10:20 CET (Europe/Bratislava)."}, {"date": "2026-11-15", "title": "Деталізація 3D v2.1.0", "detail": "Острів-гавань став детальнішим: унікальні будівлі з вікнами, дахами, антенами й підсвіткою, Ратуша з вежею-маяком, парки, ліхтарі, рух ботів і машин, кораблі даних у глибшій гавані з причалами й хвилерізами, нове небо й вода. Виправлено темну пляму на схилі Ратуші; підписи районів на iPhone не обрізаються, легенда згортається."}, {"date": "2026-11-15", "title": "Живе місто v2.2.0", "detail": "У 3D-моделі з'явилися шість аватарів жителів-ботів з іменами: вони стоять біля своїх домівок і йдуть дорогами до будівлі, коли в журналі активності є реальна подія. Громадські будівлі пульсують із чипом інструмента (ClamAV/YARA-X, restic, collect…), коли той реально працює. Стрічка подій, список «Жителі» зі статусами та вкладка «Школа» з табелем (усі 23 навички — «не перевірено», оцінок не вигадано). Дані: activity.json і school.json поруч зі сторінкою, оновлення приблизно раз на 15 хв; інструменти live/bin/activity-add, school-export, publish і нефатальні хуки в inspect, backup.sh, collect, lesson, grade, board."}], "planName": "Острів-гавань"}</script>
